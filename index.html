    <meta charset="UTF-8">

        name="viewport"

    <style>

        /* =====================================================
           ZÁKLAD
        ===================================================== */

        :root {
            --background: #06080c;
            --background-light: #0b0f15;
            --card: #10151d;
            --card-light: #151c25;
            --border: #252e39;

            --white: #ffffff;
            --text: #dce2e9;
            --muted: #8994a2;

            --blue: #39a9ff;
            --blue-light: #6bc2ff;
            --blue-dark: #1579ba;

            --green: #43df87;

            --discord: #5865f2;
            --discord-dark: #4752c4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--background);
            color: var(--white);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: sticky;
            top: 0;

            z-index: 1000;

            background:
                rgba(6, 8, 12, 0.92);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid rgba(255,255,255,0.07);
        }


        .navbar {

            width: min(1350px, 94%);

            min-height: 76px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        /* LOGO */

        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 21px;

            font-weight: 900;

            letter-spacing: 1px;

            white-space: nowrap;
        }


        .logo-icon {

            width: 40px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--blue-dark)
                );

            box-shadow:
                0 0 25px
                rgba(57,169,255,0.25);

            font-size: 20px;
        }


        .logo-blue {
            color: var(--blue);
        }


        /* NAVIGACE */

        .nav {

            display: flex;

            align-items: center;

            gap: 3px;
        }


        .nav a {

            padding:
                10px 12px;

            border-radius: 8px;

            color: #aab4c0;

            font-size: 14px;

            font-weight: 700;

            transition: 0.2s;
        }


        .nav a:hover {

            color: white;

            background: #151b23;
        }


        /* AKCE */

        .nav-actions {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .nav-button {

            padding:
                10px 14px;

            border-radius: 8px;

            background: #131922;

            border:
                1px solid #29323d;

            font-size: 13px;

            font-weight: 800;

            transition: 0.2s;
        }


        .nav-button:hover {

            background: #1c2530;
        }


        .discord-button {

            background:
                var(--discord);

            border-color:
                var(--discord);
        }


        .discord-button:hover {

            background:
                var(--discord-dark);
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position: relative;

            min-height: 670px;

            display: flex;

            align-items: center;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 80% 40%,
                    rgba(57,169,255,0.25),
                    transparent 31%
                ),

                radial-gradient(
                    circle at 60% 80%,
                    rgba(20,100,170,0.10),
                    transparent 35%
                ),

                linear-gradient(
                    90deg,
                    #06080c 0%,
                    #06080ce8 45%,
                    #06080c88 100%
                );
        }


        .hero::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    transparent,
                    rgba(57,169,255,0.04),
                    transparent
                );

            pointer-events: none;
        }


        .hero-container {

            width: min(1350px, 94%);

            margin: auto;

            position: relative;

            z-index: 2;
        }


        .hero-content {

            max-width: 800px;

            padding:
                100px 0;
        }


        .hero-label {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding:
                7px 13px;

            margin-bottom: 22px;

            border:
                1px solid #225071;

            border-radius: 100px;

            background:
                rgba(57,169,255,0.08);

            color:
                #62bdff;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 1px;
        }
